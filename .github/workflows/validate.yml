name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, claude/architecture-improvements, feat/session-room-booking-approval]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start isolated Supabase database
        run: supabase start
      - name: Verify schema baseline and privilege migration on a clean database
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema/00_baseline_snapshot.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012180000_harden_internal_function_privileges.sql
          cat > /tmp/verify-privileges.sql <<'SQL'
          DO $$
          BEGIN
            IF has_function_privilege('anon', 'app_private.consume_lesson_credit(uuid)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'app_private.consume_lesson_credit(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'internal credit routine is still executable';
            END IF;
            IF NOT has_function_privilege('authenticated', 'app_private.current_role()', 'EXECUTE') THEN
              RAISE EXCEPTION 'RLS helper privilege missing';
            END IF;
          END
          $$;
          SQL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/verify-privileges.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_privileges.test.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/center_isolation.test.sql
      - name: Smoke test production server
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/ftk-saas-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/ftk-saas-health.json; then
              cat /tmp/ftk-saas-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ftk-saas-next.log
          exit 1
