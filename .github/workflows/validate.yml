name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, claude/architecture-improvements, feat/session-room-booking-approval]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test production server
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/ftk-saas-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/ftk-saas-health.json; then
              cat /tmp/ftk-saas-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ftk-saas-next.log
          exit 1
