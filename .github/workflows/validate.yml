name: Validate

on:
  push:
    branches: [main, 'fix/**', 'recovery/**']
  pull_request:
    branches: [main, claude/architecture-improvements, feat/session-room-booking-approval]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Validate Vercel pnpm lockfile
        run: npx --yes pnpm@10.17.1 install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check shared Edge API bundle
        run: |
          npm run check:edge
          deno check supabase/functions/studio-api/index.js
          node scripts/smoke-edge-api.mjs
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start isolated Supabase database
        shell: bash
        run: |
          set -euo pipefail
          # The historical migrations were consolidated into a schema-only baseline.
          # Hold the new forward migration until the baseline has been loaded.
          mv supabase/migrations /tmp/studiosaas-migrations
          mkdir supabase/migrations
          supabase start
      - name: Verify schema baseline and privilege migration on a clean database
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          node scripts/verify-database.mjs /tmp/studiosaas-migrations
      - name: Measure representative query plans
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/supabase.env
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/performance_explain.sql | tee /tmp/performance-explain.txt
          grep -q "Execution Time" /tmp/performance-explain.txt
      - name: Exercise logical backup and restore in isolation
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/supabase.env
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          # Use pg_dump/pg_restore shipped with the PostgreSQL 17.11 server image;
          # the Ubuntu runner's default PostgreSQL client can be an older major version.
          # Restore only the application-owned schemas. Supabase platform schemas contain
          # privileged routines (for example Realtime's log_min_messages setting) that
          # cannot be recreated by the local postgres role in a sibling database.
          docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres --format=custom --no-owner --no-acl --schema=public --schema=app_private > /tmp/studiosaas-restore-drill.dump
          test -s /tmp/studiosaas-restore-drill.dump
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE restore_drill"
          docker exec "$DB_CONTAINER" psql -U postgres -d restore_drill -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE;"
          docker exec "$DB_CONTAINER" psql -U postgres -d restore_drill -v ON_ERROR_STOP=1 -c "CREATE SCHEMA public; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public;"
          docker exec "$DB_CONTAINER" psql -U postgres -d restore_drill -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY); CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';"
          docker cp /tmp/studiosaas-restore-drill.dump "$DB_CONTAINER":/tmp/studiosaas-restore-drill.dump
          docker exec "$DB_CONTAINER" pg_restore -l /tmp/studiosaas-restore-drill.dump | grep -v ' SCHEMA - public ' > /tmp/studiosaas-restore.list
          docker cp /tmp/studiosaas-restore.list "$DB_CONTAINER":/tmp/studiosaas-restore.list
          docker exec "$DB_CONTAINER" pg_restore -U postgres -d restore_drill --no-owner --no-acl --exit-on-error -L /tmp/studiosaas-restore.list /tmp/studiosaas-restore-drill.dump
          docker exec "$DB_CONTAINER" psql -U postgres -d restore_drill -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM public.members WHERE email LIKE 'perf-%@example.invalid'" | grep -qx '50000'
          docker exec "$DB_CONTAINER" psql -U postgres -d restore_drill -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM public.centers WHERE organization_id = '20000000-0000-0000-0000-000000000099'::uuid" | grep -qx '10'
          echo "Application-schema logical restore passed: 50,000 synthetic members and 10 centers restored."
      - name: Browser UX and accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Smoke test production server
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/ftk-saas-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/ftk-saas-health.json; then
              cat /tmp/ftk-saas-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ftk-saas-next.log
          exit 1
