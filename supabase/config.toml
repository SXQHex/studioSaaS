project_id = "ftkapp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

[functions.studio-api]
entrypoint = "./functions/studio-api/index.js"
# Auth is checked in the handler with auth.getUser for every protected request.
# Only OpenAPI and CORS preflight are public; commands and queries require a user JWT.
verify_jwt = false
